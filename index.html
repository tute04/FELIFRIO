<script>
(()=>{
  'use strict';
  let scheduled=false;
  function tagTables(){
    scheduled=false;
    if(!window.matchMedia('(max-width:640px)').matches)return;
    document.querySelectorAll('.tablewrap table').forEach(table=>{
      const labels=Array.from(table.querySelectorAll('thead th'),th=>th.textContent.trim());
      table.querySelectorAll('tbody tr').forEach(tr=>{
        Array.from(tr.children).forEach((td,i)=>{
          if(td.tagName==='TD' && td.dataset.label!==labels[i])td.dataset.label=labels[i]||'';
        });
      });
    });
  }
  const observer=new MutationObserver(()=>{
    if(scheduled)return;
    scheduled=true;
    requestAnimationFrame(tagTables);
  });
  const root=document.getElementById('root');
  if(root)observer.observe(root,{subtree:true,childList:true});
  window.addEventListener('resize',()=>{if(!scheduled){scheduled=true;requestAnimationFrame(tagTables)}},{passive:true});
  tagTables();
  // A service worker only works under HTTPS or localhost, not on file:// URLs.
  if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
  }
})();
</script>
